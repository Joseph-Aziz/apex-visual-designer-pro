<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake APEX host — Visual Designer smoke test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
<script>if (/[?&]dir=rtl/.test(location.search)) document.documentElement.dir = 'rtl';</script>
</head>
<body>
<!-- The fake APEX page API has to exist before the designer iframe loads. -->
<script src="fake-server.js"></script>
<script>
(function () {
  'use strict';
  window.__calls = [];

  window.apex = window.apex || {};
  window.apex.env = { APP_ID: '102', APP_SESSION: '' };
  window.apex.server = {
    // The shape repository.js uses: a jQuery-like request with done() and fail().
    plugin: function (ajax, payload, opts) {
      var record = {
        ajax: ajax,
        payload: JSON.parse(JSON.stringify(payload || {})),
        opts: opts || {},
        response: null
      };
      window.__calls.push(record);
      var done = [];
      setTimeout(function () {
        var response;
        try {
          response = window.FakeVD.server.handle(ajax, payload);
        } catch (e) {
          response = { success: false, code: -20000, message: e.message };
        }
        record.response = JSON.parse(JSON.stringify(response));
        // APEX writes error JSON with HTTP 200, so the editor's done() handler sees both cases.
        done.forEach(function (fn) { fn(response); });
      }, 0);
      var req = {
        done: function (fn) { done.push(fn); return req; },
        fail: function () { return req; }   // repository.js accepts done()/fail(); no transport failure here
      };
      return req;
    }
  };
  window.FakeVD.calls = window.__calls;
})();
</script>
<iframe id="vd-designer" title="APEX Visual Designer"
        src="/plugin/files/index.html?v=test&amp;ajax=TEST&amp;app=102"></iframe>
</body>
</html>
